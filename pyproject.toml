[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "noctivis"
version = "0.1.0"
description = "Modular agentic security intelligence platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "python-multipart>=0.0.9"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
[tool.setuptools.packages.find]
where = ["packages"]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "packages"]
